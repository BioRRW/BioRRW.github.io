name: Daily FoCo Food Truck Scraper

on:
  schedule:
    # Runs automatically every single day at 6:00 AM Mountain Time (12:00 UTC)
    - cron: '0 12 * * *'
  workflow_dispatch: # This adds a manual "Run workflow" button in your GitHub dashboard for testing

# Explicitly grant write permissions so the runner can update your assets folder
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10' # Fixed the typo here

    - name: Install Scraping Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install beautifulsoup4 requests icalendar recurring-ical-events

    - name: Execute Scraper Script
      run: python scrape_trucks.py

    - name: Commit Fresh Data File to your GitHub Pages Site
      run: |
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"
        git add assets/data/food-trucks.json
        # The || exit 0 ensures the workflow doesn't fail if the data didn't change today
        git commit -m "Automated update of local food truck schedules" || exit 0
        git push
