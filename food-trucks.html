<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Truck Dashboard</title>
    <style>
        /* Base Setup */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f4f6f8;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        header {
            margin-bottom: 30px;
            text-align: center;
        }
        h1 { margin-bottom: 5px; }
        #update-time {
            font-size: 0.9rem;
            color: #666;
            font-style: italic;
        }

        /* Filter Controls */
        .controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 30px;
        }
        .filter-btn {
            background-color: #fff;
            border: 1px solid #ccc;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s ease;
        }
        .filter-btn:hover { background-color: #f0f0f0; }
        .filter-btn.active {
            background-color: #333;
            color: #fff;
            border-color: #333;
        }

        /* Dashboard Grid & Cards */
        #dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }
        .brewery-card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .brewery-card h3 {
            margin-top: 0;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
            color: #2c3e50;
        }
        .brewery-card p {
            font-size: 0.95rem;
            line-height: 1.4;
            margin: 8px 0;
            padding: 6px 0;
        }
        
        /* Highlighting Dynamic Items */
        .today-highlight {
            background-color: #fff9db;
            border-left: 3px solid #fab005;
            padding-left: 8px !important;
            font-weight: 500;
        }
        .no-trucks {
            grid-column: 1 / -1;
            text-align: center;
            padding: 40px;
            background: #fff;
            border-radius: 8px;
            color: #777;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Local Brewery Food Truck Schedule</h1>
            <div id="update-time">Connecting to scraper sync...</div>
        </header>

        <!-- Navigation / Controls -->
        <div class="controls">
            <button class="filter-btn active" onclick="filterSchedule('all', event)">Show Full Week</button>
            <button class="filter-btn" onclick="filterSchedule('today', event)">Just Today</button>
        </div>

        <!-- Dynamic Dashboard Grid -->
        <main id="dashboard-grid"></main>
    </div>

    <!-- JavaScript Application Logic -->
    <script>
        const daysOfWeek = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
        const monthsOfYear = ["jan", "feb", "mar", "apr", "may", "jun", "jul", "aug", "sep", "oct", "nov", "dec"];

        const now = new Date();
        const currentDayName = daysOfWeek[now.getDay()];
        const currentMonthNum = now.getMonth() + 1; 
        const currentMonthName = monthsOfYear[now.getMonth()]; 
        const currentDateNum = now.getDate(); 

        let rawTruckData = {};

        // Fetch schedule data
        fetch('/assets/data/food-trucks.json?v=' + now.getTime())
            .then(res => res.json())
            .then(payload => {
                rawTruckData = payload;
                document.getElementById('update-time').innerText = `Scraper Engine Sync: ${payload.last_updated}`;
                renderDashboard('all');
            })
            .catch(err => {
                const updateElem = document.getElementById('update-time');
                if (updateElem) updateElem.innerText = "System offline. Unable to download schedule arrays.";
                console.error("Data loading failure:", err);
            });

        // Validates whether text represents a genuine schedule entry
        // Filters out footer links, nav menus, and strings with zero day configurations
        function isValidScheduleItem(textLower) {
            if (textLower.includes("back taproom") || textLower.includes("our story") || textLower.includes("contact us") || textLower.includes("about us")) {
                return false;
            }
            
            const containsDay = daysOfWeek.some(day => {
                const dLower = day.toLowerCase();
                return textLower.includes(dLower) || textLower.includes(dLower.substring(0, 3));
            });

            return containsDay;
        }

        function isListingToday(textContent) {
            if (!textContent) return false;
            
            const textLower = textContent.toLowerCase();
            if (!isValidScheduleItem(textLower)) return false;

            const dayLower = currentDayName.toLowerCase();
            const dayShortLower = dayLower.substring(0, 3);

            if (!textLower.includes(dayLower) && !textLower.includes(dayShortLower)) {
                return false;
            }

            const slashRegex = new RegExp(`\\b${currentMonthNum}\\/${currentDateNum}\\b`);
            const wordRegex = new RegExp(`\\b${currentMonthName}[a-z]*\\s+${currentDateNum}\\b`);

            const hasGenericSlashDate = /\b\d{1,2}\/\d{1,2}\b/.test(textLower);
            const hasGenericWordDate = new RegExp(`\\b(${monthsOfYear.join('|')})[a-z]*\\s+\\d{1,2}\\b`).test(textLower);

            if (hasGenericSlashDate && !slashRegex.test(textLower)) return false; 
            if (hasGenericWordDate && !wordRegex.test(textLower)) return false; 

            return true;
        }

        function renderDashboard(mode) {
            const grid = document.getElementById('dashboard-grid');
            if (!grid) return;
            grid.innerHTML = '';

            if (!rawTruckData.breweries) return;

            for (const [brewery, listings] of Object.entries(rawTruckData.breweries)) {
                // Step 1: Filter out raw navigation/garbage string rows immediately
                let filteredListings = listings.filter(item => {
                    const textContent = item.day_listing || item.schedule || item.listing || "";
                    return isValidScheduleItem(textContent.toLowerCase());
                });

                // Step 2: If 'Just Today' filter is selected, strip non-today rows
                if (mode === 'today') {
                    filteredListings = filteredListings.filter(item => {
                        const textContent = item.day_listing || item.schedule || item.listing || "";
                        return isListingToday(textContent);
                    });
                }

                if (filteredListings.length === 0) continue;

                const card = document.createElement('div');
                card.className = 'brewery-card';

                let cardHTML = `<h3>${brewery}</h3>`;
                
                filteredListings.forEach(item => {
                    const textContent = item.day_listing || item.listing || (item.truck ? `${item.truck} — ${item.schedule}` : "");
                    const isToday = isListingToday(textContent);
                    
                    cardHTML += `
                        <p class="${isToday ? 'today-highlight' : ''}">
                            ${isToday ? '<strong>[TODAY]</strong> ' : ''}${textContent}
                        </p>
                    `;
                });

                card.innerHTML = cardHTML;
                grid.appendChild(card);
            }

            if (grid.innerHTML === '') {
                grid.innerHTML = `<div class="no-trucks">No food trucks found listed for today. Check back tomorrow morning!</div>`;
            }
        }

        function filterSchedule(mode, event) {
            if (!event) return;
            const buttons = document.querySelectorAll('.filter-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            event.currentTarget.classList.add('active');
            renderDashboard(mode);
        }
    </script>
</body>
</html>
